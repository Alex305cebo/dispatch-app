name: DB backup

# The app's real data — loads, trucks, brokers, AND every document (BOL/POD/rate
# cons live as blobs) — sits in MariaDB on Hostinger, which Hostinger's own website
# backups don't promise to keep for long. This is the off-site copy: a daily dump
# pulled out of the database and kept as a GitHub artifact, independent of Hostinger.
#
# До 09/13/26 база была в Neon (Postgres) и дамп делал pg_dump. Дампы того времени
# лежат в артефактах прошлых запусков, пока не истекут 90 дней.
#
# ШИФРОВАНИЕ ОБЯЗАТЕЛЬНО. Репозиторий публичный, а артефакты публичного репозитория
# скачивает любой, кто вошёл в GitHub. До 09/23/26 дамп выкладывался открытым —
# с сессиями, хэшами паролей, ключами из settings и всеми документами. Теперь
# в артефакт идёт только dispatch-ДАТА.sql.gz.gpg (AES-256, пароль — секрет
# BACKUP_PASSPHRASE). Нет секрета — запуск падает и НИЧЕГО не выкладывает.
# Расшифровать: gpg -d dispatch-ДАТА.sql.gz.gpg > dispatch-ДАТА.sql.gz

on:
  schedule:
    # 07:00 UTC daily. Cron runs on the default branch only.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Dump database
        env:
          # mysql://user:password@host:3306/database — the same string as DATABASE_URL
          # in hPanel. The database must allow remote access (hPanel → Remote MySQL).
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
        run: |
          test -n "$MYSQL_URL" || { echo "MYSQL_URL secret is not set"; exit 1; }
          rest="${MYSQL_URL#*://}"
          creds="${rest%%@*}"; hostpart="${rest#*@}"
          user="${creds%%:*}"; pass="${creds#*:}"
          hostport="${hostpart%%/*}"; db="${hostpart#*/}"; db="${db%%\?*}"
          host="${hostport%%:*}"; port="${hostport##*:}"; [ "$port" = "$hostport" ] && port=3306
          # Пароль в файле, а не в командной строке: так он не виден в списке процессов.
          umask 077
          printf '[client]\nuser=%s\npassword=%s\nhost=%s\nport=%s\n' "$user" "$pass" "$host" "$port" > "$HOME/.my.cnf"
          stamp=$(date -u +%Y-%m-%d)
          # --single-transaction: снимок без блокировки таблиц, приложение работает дальше.
          # --hex-blob: файлы документов в дампе как hex, дамп восстанавливается и читается.
          mariadb-dump --single-transaction --skip-lock-tables --hex-blob \
            --default-character-set=utf8mb4 "$db" | gzip -9 > "dispatch-$stamp.sql.gz"
          # Пустой или оборванный дамп — провал, а не «успешный» артефакт.
          gzip -dc "dispatch-$stamp.sql.gz" | tail -1 | grep -q "Dump completed" || { echo "dump incomplete"; exit 1; }
          ls -lh "dispatch-$stamp.sql.gz"

      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          f=$(ls dispatch-*.sql.gz)
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            # Открытый дамп не остаётся даже на раннере: шаг выгрузки ниже его не найдёт.
            : > "$f"
            echo "BACKUP_PASSPHRASE secret is not set — открытый дамп не выкладывается"
            exit 1
          fi
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
          ls -lh "$f.gpg"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          # Только .gpg: открытый .sql.gz рядом с ним в артефакт не попадает.
          path: dispatch-*.sql.gz.gpg
          if-no-files-found: error
          # 90 дней: потолок GitHub, и это дешёвая страховка — три месяца ежедневных
          # дампов на случай, если проблема в базе заметится не сразу.
          retention-days: 90
