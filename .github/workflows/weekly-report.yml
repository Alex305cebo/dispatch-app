name: Weekly truck report

# Отчёт по тракам за неделю (пн–вс по ET) на почту — запасной путь, когда в Админке задан
# пароль приложения Gmail. Без пароля письмо шлёт сам сервер сайта, а этот запуск молчит.
# День, час и «выключено» — в Админке → «Отчёт на почту»; здесь только проверка «пора ли»
# раз в три часа (расписание GitHub опаздывает, неделя всё равно уходит один раз).
# В базу — тем же MYSQL_URL, что у сбора ставок. Логи публичные — только неделя и счётчики.

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Отправить ещё раз, даже если неделя уже ушла'
        type: boolean
        default: false

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Send the report
        env:
          DATABASE_URL: ${{ secrets.MYSQL_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "MYSQL_URL secret is not set"; exit 1; }
          node --conditions=react-server scripts/weekly-report.mts ${{ inputs.force && '--force' || '' }}
