name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20/LTS: the test files are .ts run directly via `node --test`
          # with no ts-node/tsx loader — that only works on Node's built-in
          # TypeScript type-stripping (23.6+), which Node 20 doesn't have.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
