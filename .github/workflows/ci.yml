name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20/LTS: the test files are .ts run directly via `node --test`
          # with no ts-node/tsx loader — that only works on Node's built-in
          # TypeScript type-stripping (23.6+), which Node 20 doesn't have.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The gate that matters: prove `next build` actually completes on a clean machine,
      # so a broken build is caught HERE instead of failing (and churning processes) on
      # Hostinger.
      #
      # DATABASE_URL здесь НЕ задан, и это часть проверки, а не упущение. Раньше
      # lib/db.ts бросал исключение при загрузке модуля, поэтому сборке требовалась
      # хотя бы фиктивная строка подключения. Для установки клиенту это была
      # ловушка: Hostinger начинает сборку сразу при подключении репозитория, до
      # того как переменные заданы, и первый деплой падал с ошибкой про базу.
      # Подключение теперь ленивое, и эта строчка сторожит границу — вернётся
      # проверка на верхний уровень, CI покраснеет здесь, а не у клиента.
      - name: Build (без DATABASE_URL — сборка не должна требовать базу)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
