name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20/LTS: the test files are .ts run directly via `node --test`
          # with no ts-node/tsx loader — that only works on Node's built-in
          # TypeScript type-stripping (23.6+), which Node 20 doesn't have.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The gate that matters: prove `next build` actually completes on a clean machine,
      # so a broken build is caught HERE instead of failing (and churning processes) on
      # Hostinger. next build imports server modules to compile them, and lib/db.ts throws
      # at import time without DATABASE_URL — a syntactically valid dummy satisfies that,
      # nothing connects (every DB page is force-dynamic, so no query runs at build).
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
          NEXT_TELEMETRY_DISABLED: '1'
